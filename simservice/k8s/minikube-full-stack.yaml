# Minikube full stack for the simulation server + simservice.
#
# Use ./build-minikube.sh from the repository root to build every local image,
# populate the required Secrets, and apply this manifest.

---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: v1
kind: Namespace
metadata:
  name: simservice

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      enableServiceLinks: false
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.2
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: kafka
spec:
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      enableServiceLinks: false
      containers:
        - name: broker
          image: confluentinc/cp-server:7.5.2
          ports:
            - containerPort: 29092
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper.kafka.svc.cluster.local:2181
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://broker.kafka.svc.cluster.local:29092,PLAINTEXT_HOST://broker.kafka.svc.cluster.local:9092
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL
              value: http://schema-registry.kafka.svc.cluster.local:8081
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: kafka
spec:
  selector:
    app: broker
  ports:
    - name: internal
      port: 29092
      targetPort: 29092
    - name: external
      port: 9092
      targetPort: 9092

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      enableServiceLinks: false
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:7.5.2
          ports:
            - containerPort: 8081
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: schema-registry
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: PLAINTEXT://broker.kafka.svc.cluster.local:29092
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC
              value: _schemas
            - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081
          startupProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: kafka
spec:
  selector:
    app: schema-registry
  ports:
    - name: http
      port: 8081
      targetPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: connect
  template:
    metadata:
      labels:
        app: connect
    spec:
      enableServiceLinks: false
      containers:
        - name: connect
          image: cnfldemos/cp-server-connect-datagen:0.6.2-7.5.0
          ports:
            - containerPort: 8083
          env:
            - name: CONNECT_BOOTSTRAP_SERVERS
              value: broker.kafka.svc.cluster.local:29092
            - name: CONNECT_REST_ADVERTISED_HOST_NAME
              value: connect
            - name: CONNECT_GROUP_ID
              value: compose-connect-group
            - name: CONNECT_CONFIG_STORAGE_TOPIC
              value: docker-connect-configs
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_FLUSH_INTERVAL_MS
              value: "10000"
            - name: CONNECT_OFFSET_STORAGE_TOPIC
              value: docker-connect-offsets
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_TOPIC
              value: docker-connect-status
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_KEY_CONVERTER
              value: org.apache.kafka.connect.storage.StringConverter
            - name: CONNECT_VALUE_CONVERTER
              value: io.confluent.connect.avro.AvroConverter
            - name: CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL
              value: http://schema-registry.kafka.svc.cluster.local:8081
            - name: CONNECT_PLUGIN_PATH
              value: /usr/share/java,/usr/share/confluent-hub-components
            - name: CONNECT_LOG4J_LOGGERS
              value: org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR
---
apiVersion: v1
kind: Service
metadata:
  name: connect
  namespace: kafka
spec:
  selector:
    app: connect
  ports:
    - name: http
      port: 8083
      targetPort: 8083

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-proxy
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest-proxy
  template:
    metadata:
      labels:
        app: rest-proxy
    spec:
      enableServiceLinks: false
      containers:
        - name: rest-proxy
          image: confluentinc/cp-kafka-rest:7.5.2
          ports:
            - containerPort: 8082
          env:
            - name: KAFKA_REST_BOOTSTRAP_SERVERS
              value: broker.kafka.svc.cluster.local:29092
            - name: KAFKA_REST_LISTENERS
              value: http://0.0.0.0:8082
            - name: KAFKA_REST_SCHEMA_REGISTRY_URL
              value: http://schema-registry.kafka.svc.cluster.local:8081
---
apiVersion: v1
kind: Service
metadata:
  name: rest-proxy
  namespace: kafka
spec:
  selector:
    app: rest-proxy
  ports:
    - name: http
      port: 8082
      targetPort: 8082

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksqldb-server
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ksqldb-server
  template:
    metadata:
      labels:
        app: ksqldb-server
    spec:
      enableServiceLinks: false
      containers:
        - name: ksqldb-server
          image: confluentinc/cp-ksqldb-server:7.5.2
          ports:
            - containerPort: 8088
          env:
            - name: KSQL_BOOTSTRAP_SERVERS
              value: broker.kafka.svc.cluster.local:29092
            - name: KSQL_HOST_NAME
              value: ksqldb-server
            - name: KSQL_LISTENERS
              value: http://0.0.0.0:8088
            - name: KSQL_KSQL_SCHEMA_REGISTRY_URL
              value: http://schema-registry.kafka.svc.cluster.local:8081
            - name: KSQL_KSQL_CONNECT_URL
              value: http://connect.kafka.svc.cluster.local:8083
---
apiVersion: v1
kind: Service
metadata:
  name: ksqldb-server
  namespace: kafka
spec:
  selector:
    app: ksqldb-server
  ports:
    - name: http
      port: 8088
      targetPort: 8088

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: simservice-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: simservice-data-pvc
  namespace: simservice
spec:
  storageClassName: manual
  volumeName: simservice-data-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: simservice
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: simservice
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: simservice-config
  namespace: simservice
data:
  config.properties: |
    kafkaBroker=broker.kafka.svc.cluster.local:9092
    schemaRegistry=http://schema-registry.kafka.svc.cluster.local:8081
    logDir=/data/logs
    definitionDirectory=/data/definitions
    rootDir=/data
    resourceDir=/data/resources
    resultsDir=/data/results
    scenariosDir=/data
    kubernetesNamespace=simservice
    containerRegistry=simservice
    containerImageTag=latest
    channelOrchestration=orchestration.simulation
    channelInteraction=interaction.simulation
    channelProvision=provision.simulation
    topicScenario=scenario
    topicResult=result
    topicResource=resource
    topicSyncMsg=sync
    topicStatusMsg=status
    topicCtrlMsg=ctrl
    requestMaxAge=16892371447030
    rabbitmqHost=rabbitmq.simservice.svc.cluster.local
    redisHost=redis.simservice.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: simservice
data:
  RABBITMQ_HOST: rabbitmq.simservice.svc.cluster.local
  REDIS_HOST: redis.simservice.svc.cluster.local
  RESULTS_DIR: /data/results
  RESOURCES_DIR: /data/resources
  KAFKA_BOOTSTRAP_SERVERS: broker.kafka.svc.cluster.local:9092
  LOG_EVENT_TOPIC: simservice.logs.events
  OIDC_DISCOVERY_URL: https://regapp.nfdi-aai.de/oidc/realms/nfdi/.well-known/openid-configuration
  OIDC_REDIRECT_URI: https://localhost:5001/auth/callback

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: simservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: simservice
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: simservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: simservice
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30672
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 31672

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: simservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      initContainers:
        - name: init-redis-data
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /data/redis/appendonlydir && chmod -R 0777 /data/redis
          volumeMounts:
            - name: redis-data
              mountPath: /data/redis
      containers:
        - name: redis
          image: redis:7
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data/redis
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data/redis
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: simservice
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: simservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: simaas-web:latest
          imagePullPolicy: Never
          command:
            - uvicorn
            - webapp:app
            - --host
            - 0.0.0.0
            - --port
            - "5001"
            - --proxy-headers
            - --ssl-keyfile
            - /data/certs/key.pem
            - --ssl-certfile
            - /data/certs/cert.pem
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secret
            - configMapRef:
                name: mosaik-config
            - configMapRef:
                name: villas-config
          volumeMounts:
            - name: simservice-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: simservice-data
          persistentVolumeClaim:
            claimName: simservice-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: simservice
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: https
      port: 5001
      targetPort: 5001
      nodePort: 30501

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-consumer
  namespace: simservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-consumer
  template:
    metadata:
      labels:
        app: log-consumer
    spec:
      containers:
        - name: log-consumer
          image: simaas-web:latest
          imagePullPolicy: Never
          command:
            - python
            - log_consumer.py
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secret
          volumeMounts:
            - name: simservice-data
              mountPath: /data
      volumes:
        - name: simservice-data
          persistentVolumeClaim:
            claimName: simservice-data-pvc

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simservice
  namespace: simservice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: simservice-job-manager
  namespace: simservice
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: simservice-job-manager-binding
  namespace: simservice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: simservice-job-manager
subjects:
  - kind: ServiceAccount
    name: simservice
    namespace: simservice

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simservice
  namespace: simservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simservice
  template:
    metadata:
      labels:
        app: simservice
    spec:
      serviceAccountName: simservice
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /data/logs /data/definitions/domains /data/definitions/layers /data/definitions/components /data/definitions/connectors /data/definitions/resources /data/resources /data/results /data/certs
              chmod -R a+rwX /data/logs /data/resources /data/results 2>/dev/null || true
              cp /config/config.properties /data/config.properties
          volumeMounts:
            - name: simservice-data
              mountPath: /data
            - name: simservice-config
              mountPath: /config
      containers:
        - name: simservice
          image: simservice/simservice:latest
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - ln -sf /data/config.properties /app/config.properties && java -jar /app/simservice.jar
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKER
              value: broker.kafka.svc.cluster.local:9092
            - name: SCHEMA_REGISTRY
              value: http://schema-registry.kafka.svc.cluster.local:8081
            - name: RABBITMQ_HOST
              value: rabbitmq.simservice.svc.cluster.local
            - name: REDIS_HOST
              value: redis.simservice.svc.cluster.local
            - name: K8S_NAMESPACE
              value: simservice
            - name: CONTAINER_REGISTRY
              value: simservice
          volumeMounts:
            - name: simservice-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - kill -0 1
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - kill -0 1
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: simservice-data
          persistentVolumeClaim:
            claimName: simservice-data-pvc
        - name: simservice-config
          configMap:
            name: simservice-config
---
apiVersion: v1
kind: Service
metadata:
  name: simservice
  namespace: simservice
spec:
  type: NodePort
  selector:
    app: simservice
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosaik-config
  namespace: simservice
data:
  MOSAIK_ENABLED: "true"
  MOSAIK_BAKE_TIMEOUT: "120"
  MOSAIK_RUN_TIMEOUT: "3600"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaik-orbit
  namespace: simservice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosaik-orbit
  template:
    metadata:
      labels:
        app: mosaik-orbit
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mosaik-orbit
          image: registry.gitlab.com/mosaik/mosaik-gui/mosaik-orbit:nfdi4energy-simaas
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: simservice-data
              mountPath: /data
          env:
            - name: MOSAIK_ORBIT_HOST
              value: "0.0.0.0"
            - name: MOSAIK_ORBIT_PORT
              value: "8442"
          ports:
            - containerPort: 8442
          readinessProbe:
            tcpSocket:
              port: 8442
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: simservice-data
          persistentVolumeClaim:
            claimName: simservice-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mosaik-orbit
  namespace: simservice
spec:
  type: ClusterIP
  selector:
    app: mosaik-orbit
  ports:
    - name: websocket
      port: 8442
      targetPort: 8442
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaik-worker
  namespace: simservice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosaik-worker
  template:
    metadata:
      labels:
        app: mosaik-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: mosaik-worker
          image: simaas-mosaik-worker:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: mosaik-config
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq.simservice.svc.cluster.local
            - name: REDIS_HOST
              value: redis.simservice.svc.cluster.local
            - name: MOSAIK_QUEUE
              value: mosaik_requests
            - name: MOSAIK_WS_URL
              value: ws://mosaik-orbit.simservice.svc.cluster.local:8442
            - name: RESULTS_DIR
              value: /data/results
            - name: RESOURCES_DIR
              value: /data/resources
          volumeMounts:
            - name: simservice-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: simservice-data
          persistentVolumeClaim:
            claimName: simservice-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosaik-gui
  namespace: simservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosaik-gui
  template:
    metadata:
      labels:
        app: mosaik-gui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mosaik-gui
          image: registry.gitlab.com/mosaik/mosaik-gui/frontend:nfdi4energy-simaas
          imagePullPolicy: IfNotPresent
          env:
            - name: MOSAIK_ORBIT_PROXY_HOST
              value: mosaik-orbit.simservice.svc.cluster.local
            - name: MOSAIK_ORBIT_PORT
              value: "8442"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mosaik-gui
  namespace: simservice
spec:
  type: ClusterIP
  selector:
    app: mosaik-gui
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: villas-config
  namespace: simservice
data:
  VILLAS_ENABLED: "true"
  VILLAS_RUN_SECONDS: "5"
  VILLAS_HTTP_TIMEOUT: "15"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: villas-node-config
  namespace: simservice
data:
  config.json: |
    {"http": {"enabled": true, "port": 8080}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: villas-worker
  namespace: simservice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: villas-worker
  template:
    metadata:
      labels:
        app: villas-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: prepare-villas-storage
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data/villas/results /data/villas/conf && chmod 0777 /data/villas/results /data/villas/conf"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: villas-worker
          image: simaas-villas-worker:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: villas-config
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq.simservice.svc.cluster.local
            - name: REDIS_HOST
              value: redis.simservice.svc.cluster.local
            - name: VILLAS_NODE_URL
              value: http://villas-node.simservice.svc.cluster.local:8080
            - name: VILLAS_QUEUE
              value: villas_requests
            - name: RESULTS_DIR
              value: /data/results
            - name: VILLAS_RESULTS_DIR
              value: /villas/results
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data
              mountPath: /villas/results
              subPath: villas/results
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: simservice-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: villas-node
  namespace: simservice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: villas-node
  template:
    metadata:
      labels:
        app: villas-node
    spec:
      automountServiceAccountToken: false
      containers:
        - name: villas-node
          image: ghcr.io/villasframework/node:1062-merge
          imagePullPolicy: IfNotPresent
          args: ["node", "/config.json"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: idle-config
              mountPath: /config.json
              subPath: config.json
              readOnly: true
            - name: data
              mountPath: /results
              subPath: villas/results
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: idle-config
          configMap:
            name: villas-node-config
        - name: data
          persistentVolumeClaim:
            claimName: simservice-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: villas-node
  namespace: simservice
spec:
  type: ClusterIP
  selector:
    app: villas-node
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: villas-conf
  namespace: simservice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: villas-conf
  template:
    metadata:
      labels:
        app: villas-conf
    spec:
      automountServiceAccountToken: false
      containers:
        - name: villas-conf
          image: registry.git.nrw/rwth-acs/public/villas/conf
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1880
          readinessProbe:
            httpGet:
              path: /
              port: 1880
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: villas/conf
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: simservice-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: villas-conf
  namespace: simservice
spec:
  type: ClusterIP
  selector:
    app: villas-conf
  ports:
    - name: http
      port: 1880
      targetPort: 1880
